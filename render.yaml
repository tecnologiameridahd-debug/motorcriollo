# Servicio NUEVO. No toca DateRadar ni CoachRadar ni GasRadar.
# En Render: New → Blueprint → este repo MotorCriollo
# o New → Web Service → repo MotorCriollo (más seguro: no toca nada más).

services:
  - type: web
    name: MotorCriollo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: MOTORCRIOLLO_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: MOTORCRIOLLO_GOOGLE_CLIENT_ID
        sync: false
      - key: MOTORCRIOLLO_GOOGLE_CLIENT_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: MOTORCRIOLLO_ADMIN
        sync: false
      # Carros/cuentas demo apagados en producción salvo MOTORCRIOLLO_DEMO=1
      - key: MOTORCRIOLLO_DEMO
        value: "0"
