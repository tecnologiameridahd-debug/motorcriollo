{% extends "base.html" %}
{% block title %}Panel MotorCriollo{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>Panel de MotorCriollo</h1>
  <p class="legal-meta">Solo Alberto. Verifica vendedores y da el ID.</p>
  {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
  <form class="stack" method="post" action="/admin/entrar">
    <div class="field">
      <label>Clave de admin</label>
      <input type="password" name="password" required autofocus />
    </div>
    <button class="btn btn-block" type="submit">Entrar al panel</button>
  </form>
</div>
{% endblock %}
