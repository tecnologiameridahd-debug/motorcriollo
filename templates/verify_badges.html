<div class="vbadges vbadges-{{ size|default('md') }}">
  <div class="vbadge {% if level >= 1 %}on{% endif %}">
    <span class="vn">1</span>
    <span class="vl"><strong>Cédula verificada</strong>{% if size != 'sm' %}<em>Vendedor verificado</em>{% endif %}</span>
  </div>
  <div class="vbadge {% if level >= 2 %}on{% endif %}">
    <span class="vn">2</span>
    <span class="vl"><strong>Papeles del carro</strong>{% if size != 'sm' %}<em>Título, serial y odómetro</em>{% endif %}</span>
  </div>
  <div class="vbadge {% if level >= 3 %}on{% endif %}">
    <span class="vn">3</span>
    <span class="vl"><strong>Inspección</strong>{% if size != 'sm' %}<em>Presencial o mecánico aliado</em>{% endif %}</span>
  </div>
</div>
