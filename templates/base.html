<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#111315" />
<title>{% block title %}MotorCriollo{% endblock %}</title>
<meta name="description" content="Compra y vende carros usados cerca de ti." />
<link rel="icon" type="image/svg+xml" href="/static/icon.svg" />
<link rel="stylesheet" href="/static/style.css?v=2" />
{% block extra_head %}{% endblock %}
</head>
<body>
<header class="topbar">
  <a class="brand" href="/">
    <img class="brand-mark" src="/static/icon.svg" width="34" height="34" alt="" />
    <span class="brand-word"><span class="brand-motor">Motor</span><span class="brand-criollo">Criollo</span></span>
  </a>
  <nav class="nav">
    {% if me %}
      <a href="/publicar">Publicar</a>
      <a href="/mis-publicaciones">Mis publicaciones</a>
      <a href="/mensajes">Mensajes</a>
      <a href="/salir" class="btn btn-ghost btn-sm">Salir</a>
    {% else %}
      <a href="/login">Entrar</a>
      <a class="btn btn-sm" href="/registro">Crear cuenta</a>
    {% endif %}
  </nav>
</header>
<main>
  {% block content %}{% endblock %}
</main>
<footer class="foot">
  <span>MotorCriollo · compra y vende carros cerca de ti</span>
  <nav class="foot-links">
    <a href="/">Explorar</a>
    <a href="/publicar">Vender un carro</a>
    <a href="/terminos">Términos y condiciones</a>
    <a href="/privacidad">Privacidad</a>
  </nav>
</footer>
</body>
</html>
